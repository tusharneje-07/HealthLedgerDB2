<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - HealthLedger</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <style>
        .kpi-card {
            background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Page Loading Animation */
        #page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        #page-loader.show {
            display: flex;
        }

        .loader-content {
            text-align: center;
        }

        .spinner-ring {
            display: inline-block;
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
        }

        .spinner-ring:after {
            content: " ";
            display: block;
            width: 52px;
            height: 52px;
            margin: 6px;
            border-radius: 50%;
            border: 6px solid #3b82f6;
            border-color: #3b82f6 transparent #3b82f6 transparent;
            animation: spinner-ring 1.2s linear infinite;
        }

        @keyframes spinner-ring {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .loader-text {
            color: #e4e4e7;
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen flex flex-col">

    <!-- Page Loading Overlay -->
    <div id="page-loader">
        <div class="loader-content">
            <div class="spinner-ring"></div>
            <div class="loader-text">Loading...</div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="bg-zinc-800 border-b border-zinc-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center">
                    <img src="{% static 'images/logo.png' %}" alt="HealthLedger" style="width: 13rem;">
                </div>
            </div>
        </div>
    </nav>

    <!-- Logout Message Section -->
    <main class="flex-grow flex items-center justify-center px-6">
        <div class="kpi-card border border-zinc-700 rounded-2xl p-10 text-center shadow-lg w-full max-w-md fade-in">
            <div class="flex justify-center mb-6">
                <svg class="w-16 h-16 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-semibold mb-2 text-zinc-100">You’ve been logged out</h1>
            <p class="text-zinc-400 mb-6">Thank you for using <span class="text-zinc-100 font-medium">HealthLedger</span>. We hope to see you again soon.</p>

            <button onclick="window.location.href='/login'" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-all duration-200 mb-3 shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 focus:ring-offset-zinc-900">
                Log in again
            </button>

            <button onclick="window.location.href='/logout/hard'" class="w-full bg-zinc-700 hover:bg-zinc-600 text-zinc-100 border border-zinc-600 font-medium py-2.5 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-zinc-600 focus:ring-offset-zinc-900">
                Complete Logout
            </button>

            <p class="mt-4 text-sm text-zinc-500">
                Redirecting to login page in <span id="countdown">25</span> seconds...
            </p>
        </div>
    </main>

    <script>
        // Simple countdown redirect
        let seconds = 25;
        const countdown = document.getElementById("countdown");
        const interval = setInterval(() => {
            seconds--;
            countdown.textContent = seconds;
            if (seconds === 0) {
                clearInterval(interval);
                window.location.href = '/';
            }
        }, 1000);

        // Show loader on page navigation
        document.addEventListener('DOMContentLoaded', function() {
            document.addEventListener('click', function(e) {
                const link = e.target.closest('a');
                const clickable = e.target.closest('[onclick]');
                
                if (link && link.href && !link.target && !link.hasAttribute('download')) {
                    const url = new URL(link.href);
                    if (url.origin === window.location.origin && !link.href.includes('#')) {
                        e.preventDefault();
                        document.getElementById('page-loader').classList.add('show');
                        setTimeout(function() {
                            window.location.href = link.href;
                        }, 100);
                    }
                } else if (clickable && clickable.getAttribute('onclick')) {
                    const onclickAttr = clickable.getAttribute('onclick');
                    if (onclickAttr.includes('window.location')) {
                        document.getElementById('page-loader').classList.add('show');
                    }
                }
            });

            const forms = document.querySelectorAll('form');
            forms.forEach(function(form) {
                form.addEventListener('submit', function() {
                    document.getElementById('page-loader').classList.add('show');
                });
            });
        });
    </script>

</body>
</html>
