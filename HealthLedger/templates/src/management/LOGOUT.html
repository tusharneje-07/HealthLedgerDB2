<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - HealthLedger</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-zinc-800 border-b border-zinc-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center">
                    <div class="text-xl font-semibold text-zinc-100">
                        HealthLedger
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Logout Message Section -->
    <main class="flex-grow flex items-center justify-center px-6">
        <div class="bg-zinc-800 border border-zinc-700 rounded-2xl p-10 text-center shadow-lg w-full max-w-md">
            <div class="flex justify-center mb-6">
                <svg class="w-16 h-16 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2H5V9h4V7l5 4-5 4zM12 19a7 7 0 100-14 7 7 0 000 14z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-semibold mb-2 text-zinc-100">You’ve been logged out</h1>
            <p class="text-zinc-400 mb-6">Thank you for using <span class="text-zinc-100 font-medium">HealthLedger</span>. We hope to see you again soon.</p>

            <button onclick="window.location.href='/login'" class="w-full bg-emerald-500 hover:bg-emerald-600 text-zinc-100 font-medium py-2.5 rounded-lg transition-all duration-200 mb-2">
                Log in again
            </button>

            <button onclick="window.location.href='/logout/hard'" class="w-full bg-emerald-500 hover:bg-emerald-600 text-zinc-100 font-medium py-2.5 rounded-lg transition-all duration-200">
                Logout
            </button>

            <p class="mt-4 text-sm text-zinc-500">
                Redirecting to login page in <span id="countdown">25</span> seconds...
            </p>
        </div>
    </main>

    <script>
        // Simple countdown redirect
        let seconds = 25;
        const countdown = document.getElementById("countdown");
        const interval = setInterval(() => {
            seconds--;
            countdown.textContent = seconds;
            if (seconds === 0) {
                clearInterval(interval);
                window.location.href = '/';
            }
        }, 1000);
    </script>

</body>
</html>
