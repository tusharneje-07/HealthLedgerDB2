<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - HealthLedger</title>
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <style>
        .kpi-card {
            background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-zinc-800 border-b border-zinc-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center">
                    <div class="text-xl font-semibold text-zinc-100">
                        HealthLedger
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Logout Message Section -->
    <main class="flex-grow flex items-center justify-center px-6">
        <div class="kpi-card border border-zinc-700 rounded-2xl p-10 text-center shadow-lg w-full max-w-md fade-in">
            <div class="flex justify-center mb-6">
                <svg class="w-16 h-16 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-semibold mb-2 text-zinc-100">You’ve been logged out</h1>
            <p class="text-zinc-400 mb-6">Thank you for using <span class="text-zinc-100 font-medium">HealthLedger</span>. We hope to see you again soon.</p>

            <button onclick="window.location.href='/login'" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition-all duration-200 mb-3 shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 focus:ring-offset-zinc-900">
                Log in again
            </button>

            <button onclick="window.location.href='/logout/hard'" class="w-full bg-zinc-700 hover:bg-zinc-600 text-zinc-100 border border-zinc-600 font-medium py-2.5 rounded-lg transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-zinc-600 focus:ring-offset-zinc-900">
                Complete Logout
            </button>

            <p class="mt-4 text-sm text-zinc-500">
                Redirecting to login page in <span id="countdown">25</span> seconds...
            </p>
        </div>
    </main>

    <script>
        // Simple countdown redirect
        let seconds = 25;
        const countdown = document.getElementById("countdown");
        const interval = setInterval(() => {
            seconds--;
            countdown.textContent = seconds;
            if (seconds === 0) {
                clearInterval(interval);
                window.location.href = '/';
            }
        }, 1000);
    </script>

</body>
</html>
