
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>HealthLedger | Login</title>
	{% load static %}
	<link href="{% static 'css/output.css' %}" rel="stylesheet">
	<style>
		/* small helper for the sliding forms */
		.form-slider { transition: transform 300ms cubic-bezier(.2,.9,.2,1); }
		.toggle-btn-active { background: rgba(255,255,255,0.06); }
		
		/* Gradient card styling */
		.kpi-card {
			background: linear-gradient(135deg, #18181b 0%, #27272a 100%);
			border: 1px solid #3f3f46;
		}
		
		/* Fade-in animation */
		@keyframes fadeIn {
			from {
				opacity: 0;
				transform: translateY(10px);
			}
			to {
				opacity: 1;
				transform: translateY(0);
			}
		}
		.fade-in {
			animation: fadeIn 0.5s ease-out;
		}

		/* Animated Background */
		.animated-bg {
			background: #000000;
		}

		/* Floating orbs */
		.orb {
			position: absolute;
			border-radius: 50%;
			background: radial-gradient(circle at 30% 30%, rgba(59, 130, 246, 0.5), rgba(37, 99, 235, 0.25));
			filter: blur(40px);
			opacity: 0.8;
		}

		.orb:nth-child(1) {
			width: 250px;
			height: 250px;
			top: 10%;
			left: 5%;
			animation: float1 25s infinite ease-in-out;
		}

		.orb:nth-child(2) {
			width: 200px;
			height: 200px;
			top: 15%;
			right: 8%;
			animation: float2 30s infinite ease-in-out;
		}

		.orb:nth-child(3) {
			width: 280px;
			height: 280px;
			bottom: 15%;
			left: 15%;
			animation: float3 28s infinite ease-in-out;
		}

		.orb:nth-child(4) {
			width: 220px;
			height: 220px;
			bottom: 10%;
			right: 20%;
			animation: float4 22s infinite ease-in-out;
		}

		.orb:nth-child(5) {
			width: 180px;
			height: 180px;
			top: 45%;
			left: 50%;
			animation: float5 26s infinite ease-in-out;
		}

		@keyframes float1 {
			0%, 100% {
				transform: translate(0, 0);
			}
			25% {
				transform: translate(100px, -80px);
			}
			50% {
				transform: translate(-60px, 90px);
			}
			75% {
				transform: translate(80px, 50px);
			}
		}

		@keyframes float2 {
			0%, 100% {
				transform: translate(0, 0);
			}
			25% {
				transform: translate(-90px, 70px);
			}
			50% {
				transform: translate(70px, -60px);
			}
			75% {
				transform: translate(-50px, -40px);
			}
		}

		@keyframes float3 {
			0%, 100% {
				transform: translate(0, 0);
			}
			25% {
				transform: translate(60px, 80px);
			}
			50% {
				transform: translate(-80px, -70px);
			}
			75% {
				transform: translate(90px, -30px);
			}
		}

		@keyframes float4 {
			0%, 100% {
				transform: translate(0, 0);
			}
			25% {
				transform: translate(-70px, -60px);
			}
			50% {
				transform: translate(80px, 70px);
			}
			75% {
				transform: translate(-40px, 50px);
			}
		}

		@keyframes float5 {
			0%, 100% {
				transform: translate(0, 0);
			}
			25% {
				transform: translate(70px, 60px);
			}
			50% {
				transform: translate(-90px, -50px);
			}
			75% {
				transform: translate(60px, -70px);
			}
		}

		/* Brand overlay animation */
		@keyframes logoScale {
			0% {
				transform: scale(0.8);
				opacity: 0;
			}
			50% {
				transform: scale(1.05);
				opacity: 1;
			}
			100% {
				transform: scale(1);
				opacity: 1;
			}
		}
		
		@keyframes overlayFadeOut {
			0% {
				opacity: 1;
			}
			80% {
				opacity: 1;
			}
			100% {
				opacity: 0;
			}
		}
		
		.logo-animate {
			animation: logoScale 1.6s ease-out;
		}
		
		.overlay-fadeout {
			animation: overlayFadeOut 2s ease-out forwards;
		}

		/* Page Loading Animation */
		#page-loader {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			background: rgba(0, 0, 0, 0.85);
			backdrop-filter: blur(8px);
			z-index: 99999;
			display: none;
			align-items: center;
			justify-content: center;
		}

		#page-loader.show {
			display: flex;
		}

		.loader-content {
			text-align: center;
		}

		.spinner-ring {
			display: inline-block;
			width: 64px;
			height: 64px;
			margin-bottom: 16px;
		}

		.spinner-ring:after {
			content: " ";
			display: block;
			width: 52px;
			height: 52px;
			margin: 6px;
			border-radius: 50%;
			border: 6px solid #3b82f6;
			border-color: #3b82f6 transparent #3b82f6 transparent;
			animation: spinner-ring 1.2s linear infinite;
		}

		@keyframes spinner-ring {
			0% {
				transform: rotate(0deg);
			}
			100% {
				transform: rotate(360deg);
			}
		}

		.loader-text {
			color: #e4e4e7;
			font-size: 16px;
			font-weight: 500;
		}
	</style>
</head>
<body class="bg-zinc-900 min-h-screen text-zinc-100 flex items-center justify-center px-4">

	<!-- Page Loading Overlay -->
	<div id="page-loader">
		<div class="loader-content">
			<div class="spinner-ring"></div>
			<div class="loader-text">Loading...</div>
		</div>
	</div>

	<!-- Brand Animation Overlay with Animated Background -->
	<div id="brand-overlay" class="fixed inset-0 w-full h-full animated-bg z-[9999] flex items-center justify-center overlay-fadeout overflow-hidden">
		<!-- Floating orbs -->
		<div class="orb"></div>
		<div class="orb"></div>
		<div class="orb"></div>
		<div class="orb"></div>
		<div class="orb"></div>
		
		<!-- Logo -->
		<div class="logo-animate">
			<img src="{% static 'images/logo.svg' %}" alt="HealthLedger" class="w-80 h-auto">
		</div>
	</div>

	<div class="max-w-4xl w-full grid grid-cols-1 lg:grid-cols-1 gap-8 items-center">
		<div class="kpi-card fade-in rounded-2xl p-6 sm:p-10 shadow-2xl">
			<div class="flex items-center justify-between mb-6 w-full">
				<div>
					<h2 class="text-2xl font-semibold">Sign in</h2>
					<p class="text-sm text-zinc-400 mt-1">Choose your login type and enter credentials</p>
				</div>
				<div class="hidden sm:flex items-center gap-3">
					<img style="width: 15rem;" src="{% static 'images/logo.svg' %}" alt="heart-with-pulse"/>
				</div>
			</div>

			<!-- Toggle -->
			<div class="flex bg-zinc-900/50 rounded-lg p-1 border border-zinc-600 mb-6 w-full max-w-md shadow-md">
				<button id="btn-staff" class="toggle-btn flex-1 text-sm py-2 rounded-lg text-zinc-100 font-medium text-center transition-all duration-200">Hospital Staff</button>
				<button id="btn-patient" class="toggle-btn flex-1 text-sm py-2 rounded-lg text-zinc-400 font-medium text-center transition-all duration-200">Patient</button>
			</div>

			<!-- Forms container -->
			<div class="relative overflow-hidden">
				<div id="forms" class="w-[200%] flex form-slider" style="transform: translateX(0%);">
					<!-- Staff Form -->
					<form id="form-staff" class="w-1/2 pr-6" method="post" action="/login/">
						{% csrf_token %}
						<input type="hidden" name="user_type" value="S">
						<div class="space-y-4">
							<label class="block">
								<span class="text-sm text-zinc-400 font-medium">Hospital Email</span>
								<input name="username" type="email" required class="mt-1 block w-full rounded-md bg-zinc-900/60 border border-zinc-600 text-zinc-100 placeholder-zinc-500 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all duration-200" placeholder="staff@hospital.org">
							</label>

							<label class="block">
								<span class="text-sm text-zinc-400 font-medium">Password</span>
								<div class="relative">
									<input id="staff-password" name="password" type="password" required class="mt-1 block w-full rounded-md bg-zinc-900/60 border border-zinc-600 text-zinc-100 placeholder-zinc-500 px-3 py-2 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all duration-200" placeholder="••••••••">
									<button type="button" aria-label="Toggle password visibility" data-target="staff-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-zinc-400 hover:text-zinc-100">
										<!-- Eye (visible) and Eye-off (hidden) SVGs; we'll toggle via JS -->
										<svg id="staff-eye-open" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
											<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
											<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
										</svg>
										<svg id="staff-eye-closed" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor">
											<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.956 9.956 0 012.223-3.434m3.06-2.467A9.97 9.97 0 0112 5c4.477 0 8.268 2.943 9.542 7-.162.516-.373 1.012-.628 1.475M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
											<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
										</svg>
									</button>
								</div>
							</label>

							<div class="flex items-center justify-between text-sm text-zinc-400">
								<label class="inline-flex items-center gap-2">
									<input type="checkbox" hidden checked name="remember" class="rounded bg-zinc-700 text-zinc-200 focus:ring-zinc-600">
									{% comment %} <span>Remember me</span> {% endcomment %}
								</label>
							</div>

							<div>
								<button type="submit" class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-all duration-200 shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 focus:ring-offset-zinc-900">Sign in as Staff</button>
							</div>
						</div>
					</form>

					<!-- Patient Form -->
					<form id="form-patient" class="w-1/2 pl-6" method="post" action="/login/patient/">
						{% csrf_token %}
						<input type="hidden" name="user_type" value="P">
						<div class="space-y-4">
							<label class="block">
								<span class="text-sm text-zinc-400 font-medium">Patient ID or Email</span>
								<input name="email" type="text" required class="mt-1 block w-full rounded-md bg-zinc-900/60 border border-zinc-600 text-zinc-100 placeholder-zinc-500 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all duration-200" placeholder="Patient ID or email">
							</label>

							<label class="block">
								<span class="text-sm text-zinc-400 font-medium">Password</span>
								<div class="relative">
									<input id="patient-password" name="password" type="password" required class="mt-1 block w-full rounded-md bg-zinc-900/60 border border-zinc-600 text-zinc-100 placeholder-zinc-500 px-3 py-2 pr-10 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition-all duration-200" placeholder="••••••••">
									<button type="button" aria-label="Toggle password visibility" data-target="patient-password" class="absolute inset-y-0 right-0 pr-3 flex items-center text-zinc-400 hover:text-zinc-100">
										<svg id="patient-eye-open" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
											<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
											<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
										</svg>
										<svg id="patient-eye-closed" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor">
											<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.477 0-8.268-2.943-9.542-7a9.956 9.956 0 012.223-3.434m3.06-2.467A9.97 9.97 0 0112 5c4.477 0 8.268 2.943 9.542 7-.162.516-.373 1.012-.628 1.475M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
											<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
										</svg>
									</button>
						</div>
					</label>

							<div>
								<button type="submit" class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 transition-all duration-200 shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 focus:ring-offset-zinc-900">Sign in as Patient</button>
							</div>
							
							<div class="text-center">
								<a href="/reset-password/" class="text-sm text-blue-400 hover:text-blue-300 transition-colors">
									Forgot your password?
								</a>
							</div>
						</div>
					</form>
				</div>
			</div>

            <form action="/login/" class="hidden" method="post" id="token_key_login">
                {% csrf_token %}
                <input type="text" name="has_token_key" id="has_token_key">
            </form>
		</div>
		</div>

	<!-- Modal markup -->
	<div id="passkey-modal-backdrop" class="hidden fixed inset-0 bg-black/50 z-50 items-center justify-center">
		<div id="passkey-modal" class="kpi-card text-zinc-100 rounded-lg shadow-xl w-full max-w-md mx-auto p-6">
			<div class="flex justify-between items-start">
				<h3 class="text-lg font-semibold">Login with Auth Key</h3>
				<button id="passkey-modal-close" aria-label="Close" class="text-zinc-300 hover:text-zinc-100">✕</button>
			</div>
			<p id="passkey-modal-body" class="mt-4 text-sm text-zinc-300">Auto Sign in using your auth key.</p>
			<div class="mt-6 flex gap-3">
				<button id="passkey-modal-login" class="flex-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-medium shadow-md transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-600 focus:ring-offset-zinc-900" onclick="auth_key_login()">Login with Key</button>
				<button id="passkey-modal-cancel" class="flex-1 px-4 py-2 bg-zinc-700 hover:bg-zinc-600 text-zinc-100 border border-zinc-600 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-zinc-600 focus:ring-offset-zinc-900">Close</button>
			</div>
		</div>
	</div>
	
	<script>
		console.log("Login page script loaded.");
		
		// Remove brand overlay after animation completes
		document.addEventListener('DOMContentLoaded', function() {
			const overlay = document.getElementById('brand-overlay');
			if (overlay) {
				setTimeout(function() {
					overlay.style.display = 'none';
				}, 2000); // Remove after 2 seconds
			}
		});
		
		function auth_key_login() {
			console.log("Auth key login triggered.");
			if (getCookie('user_type') === 'S') {
				document.getElementById('token_key_login').action = '/login/';
				document.getElementById('token_key_login').submit();
			} else if (getCookie('user_type') === 'P') {
				document.getElementById('token_key_login').action = '/login/patient/';
				document.getElementById('token_key_login').submit();
			} else {
				console.error("Unknown user type for auth key login.");
			}
			
		}
	</script>

	{% if error %}
	<div id="error_popup" class="fixed inset-0 bg-black/50 z-50 items-center justify-center top-0 left-0 flex">
		<div id="error_modal" class="kpi-card text-zinc-100 rounded-lg shadow-xl w-full max-w-md mx-auto p-6">
			<div class="flex justify-between items-start">
				<h3 class="text-lg font-semibold">Login Failed!</h3>
				<button id="error-modal-close" aria-label="Close" class="text-zinc-300 hover:text-zinc-100" onclick="document.getElementById('error_popup').classList.add('hidden')">✕</button>
			</div>
			<p id="error-modal-body" class="mt-4 text-sm text-zinc-300">{{error_msg}}</p>
			<div class="mt-6 flex gap-3">				
				<button id="error-modal-cancel" class="flex-1 px-4 py-2 bg-zinc-700 hover:bg-zinc-600 text-zinc-100 border border-zinc-600 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-zinc-600 focus:ring-offset-zinc-900" onclick="document.getElementById('error_popup').classList.add('hidden')">Close</button>
			</div>
		</div>
	</div>
	{% endif %}
	
	<script>
		// Toggle logic to slide between staff and patient forms
		const btnStaff = document.getElementById('btn-staff');
		const btnPatient = document.getElementById('btn-patient');
		const forms = document.getElementById('forms');

		function setActive(role) {
			if (role === 'staff') {
				forms.style.transform = 'translateX(0%)';
				btnStaff.classList.add('text-zinc-100','toggle-btn-active');
				btnStaff.classList.remove('text-zinc-400');
				btnPatient.classList.remove('text-zinc-100','toggle-btn-active');
				btnPatient.classList.add('text-zinc-400');
			} else {
				forms.style.transform = 'translateX(-51.5%)';
				btnPatient.classList.add('text-zinc-100','toggle-btn-active');
				btnPatient.classList.remove('text-zinc-400');
				btnStaff.classList.remove('text-zinc-100','toggle-btn-active');
				btnStaff.classList.add('text-zinc-400');
			}
		}

		btnStaff.addEventListener('click', () => setActive('staff'));
		btnPatient.addEventListener('click', () => setActive('patient'));

		// Initialize state based on a simple heuristic (or default to staff)
		document.addEventListener('DOMContentLoaded', () => {
			setActive('staff');
			initPasswordToggles();
			if (typeof initWebAuthnUI === 'function') initWebAuthnUI();
		});

		// Password visibility toggle initializer
		function initPasswordToggles() {
			const buttons = document.querySelectorAll('button[data-target]');
			buttons.forEach(btn => {
				const targetId = btn.getAttribute('data-target');
				const input = document.getElementById(targetId);
				if (!input) return;
				const svgs = btn.querySelectorAll('svg');
				const openIcon = svgs[0];
				const closedIcon = svgs[1];
				// Set initial accessible attributes
				btn.setAttribute('aria-pressed', 'false');
				btn.setAttribute('title', 'Show password');
				// Click toggles type and icons
				btn.addEventListener('click', () => {
					if (input.type === 'password') {
						input.type = 'text';
						btn.setAttribute('aria-pressed', 'true');
						btn.setAttribute('title', 'Hide password');
						if (openIcon) openIcon.classList.add('hidden');
						if (closedIcon) closedIcon.classList.remove('hidden');
					} else {
						input.type = 'password';
						btn.setAttribute('aria-pressed', 'false');
						btn.setAttribute('title', 'Show password');
						if (openIcon) openIcon.classList.remove('hidden');
						if (closedIcon) closedIcon.classList.add('hidden');
					}
				});
			});
		}

		// Simple helper to read cookie by name
		function getCookie(name) {
			const value = `; ${document.cookie}`;
			const parts = value.split(`; ${name}=`);
			if (parts.length === 2) return parts.pop().split(';').shift();
			return null;
		}

		// Show modal when auth_token cookie exists
		document.addEventListener('DOMContentLoaded', function () {
			var name = getCookie('auth_token_name') || 'Unknown User';
            var hasTokenKey = getCookie('auth_token') || null;

            document.getElementById('has_token_key').value = hasTokenKey || '';
            if (!hasTokenKey) return; 
			var backdrop = document.getElementById('passkey-modal-backdrop');
			var body = document.getElementById('passkey-modal-body');
			var btnLogin = document.getElementById('passkey-modal-login');
			var btnClose = document.getElementById('passkey-modal-close');
			var btnCancel = document.getElementById('passkey-modal-cancel');

			// personalize message
			body.textContent = 'Auto Login as ' + name + ' using your Auth Key. No Password needed.';

			// show backdrop and center it using flex
			backdrop.classList.remove('hidden');
			backdrop.classList.add('flex');

			// Close handlers
			btnClose.addEventListener('click', function () { backdrop.classList.remove('flex'); backdrop.classList.add('hidden'); });
			btnCancel.addEventListener('click', function () { backdrop.classList.remove('flex'); backdrop.classList.add('hidden'); });

			// Login with Key handler: trigger existing passkey sign-in button if present
			btnLogin.addEventListener('click', function () {
				backdrop.classList.remove('flex'); backdrop.classList.add('hidden');
				document.getElementById('token_key_login').submit()
			});
		});

		// Show loader on page navigation
		document.addEventListener('DOMContentLoaded', function() {
			// Intercept all clicks on links
			document.addEventListener('click', function(e) {
				const link = e.target.closest('a');
				if (link && link.href && !link.target && !link.hasAttribute('download')) {
					const url = new URL(link.href);
					// Only show loader for same-origin navigation
					if (url.origin === window.location.origin && !link.href.includes('#')) {
						e.preventDefault();
						document.getElementById('page-loader').classList.add('show');
						setTimeout(function() {
							window.location.href = link.href;
						}, 100);
					}
				}
			});

			// Show loader on form submissions
			const forms = document.querySelectorAll('form');
			forms.forEach(function(form) {
				form.addEventListener('submit', function() {
					document.getElementById('page-loader').classList.add('show');
				});
			});
		});
	</script>
</body>
