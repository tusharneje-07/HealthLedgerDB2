<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Record</title>
    {% load static %}
    <link href="{% static 'output.css' %}" rel="stylesheet">
</head>
<body class="bg-zinc-900 min-h-screen text-zinc-100">

    <!-- Navbar -->
    <nav class="bg-zinc-800 border-b border-zinc-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="text-xl font-semibold text-zinc-100">HealthLedger</div>
                <div class="hidden md:flex space-x-6">
                    <a href="#" class="text-zinc-400 hover:text-zinc-100 transition-colors duration-200">Home</a>
                    <a href="#" class="text-zinc-400 hover:text-zinc-100 transition-colors duration-200">Records</a>
                    <a href="#" class="text-zinc-400 hover:text-zinc-100 transition-colors duration-200">Settings</a>
                </div>
                <button class="md:hidden text-zinc-400 hover:text-zinc-100">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Container -->
    <div class="max-w-full mx-auto px-4 py-12 sm:px-6 lg:px-8">
        
        <!-- Form Card -->
        <div class="bg-zinc-800 rounded-lg shadow-2xl overflow-hidden">
            
            <!-- Header -->
            <div class="px-8 py-6 border-b border-zinc-700">
                <h1 class="text-2xl font-semibold text-zinc-100">Create new workplan</h1>
            </div>
            
            <!-- Form Body -->
            <div class="p-8">
                <form id="recordForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <!-- REC_NUMBER Field -->
                    <!-- <div class="flex flex-col w-full">
                        <label for="recNumber" class="text-sm font-medium text-zinc-400 mb-2">Record Number</label>
                        <input type="number" id="recNumber" name="recNumber" required
                            class="w-full bg-zinc-700 border-0 rounded-lg px-4 py-3 text-zinc-100 placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-zinc-800 transition-all duration-200"
                            placeholder="Enter record number">
                    </div> -->

                    <!-- UID Field -->
                    <div class="flex flex-col w-full">
                        <label for="uid" class="text-sm font-medium text-zinc-400 mb-2">UID</label>
                        <input type="text" id="uid" name="uid"
                            class="w-full bg-zinc-700 border-0 rounded-lg px-4 py-3 text-zinc-100 placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-zinc-800 transition-all duration-200"
                            placeholder="ABC999">
                        <p class="mt-2 text-xs text-zinc-500">Enter Users Unique ID.</p>
                    </div>

                    <!-- USERNAME Field -->
                    <div class="flex flex-col w-full">
                        <label for="username" class="text-sm font-medium text-zinc-400 mb-2">Name of Patient</label>
                        <input type="text" id="username" name="username"
                            class="w-full bg-zinc-700 border-0 rounded-lg px-4 py-3 text-zinc-100 placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-zinc-800 transition-all duration-200"
                            placeholder="Enter username">
                    </div>

                    <!-- INVOICE_NUM Field -->
                    <div class="flex flex-col w-full">
                        <label for="invoiceNum" class="text-sm font-medium text-zinc-400 mb-2">Invoice Number</label>
                        <input type="text" id="invoiceNum" name="invoiceNum"
                            class="w-full bg-zinc-700 border-0 rounded-lg px-4 py-3 text-zinc-100 placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-zinc-800 transition-all duration-200"
                            placeholder="INV00000001">
                    </div>

                    <!-- DATE Field -->
                    <div class="flex flex-col w-full">
                        <label for="date" class="text-sm font-medium text-zinc-400 mb-2">Date</label>
                        <input type="date" id="date" name="date"
                            class="w-full bg-zinc-700 border-0 rounded-lg px-4 py-3 text-zinc-100 placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-zinc-800 transition-all duration-200">
                    </div>

                    <!-- AMOUNT Field -->
                    <div class="flex flex-col w-full">
                        <label for="amount" class="text-sm font-medium text-zinc-400 mb-2">Amount</label>
                        <input type="number" step="0.01" id="amount" name="amount"
                            class="w-full bg-zinc-700 border-0 rounded-lg px-4 py-3 text-zinc-100 placeholder:text-zinc-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 focus:ring-offset-zinc-800 transition-all duration-200"
                            placeholder="0.00">
                    </div>

                    <!-- Success/Error Message Area (full width) -->
                    <div class="md:col-span-2" id="messageContainer" class="hidden">
                        <div id="successMessage" class="hidden bg-green-900/30 border border-green-700 text-green-400 px-4 py-3 rounded-lg">
                            Record created successfully!
                        </div>
                        <div id="errorMessage" class="hidden bg-red-900/30 border border-red-700 text-red-400 px-4 py-3 rounded-lg">
                            Error creating record. Please try again.
                        </div>
                    </div>

                    <!-- Action Buttons (full width) -->
                    <div class="md:col-span-2 flex flex-col-reverse sm:flex-row gap-3 pt-4">
                        <button type="button" onclick="window.history.back()"
                            class="flex-1 px-6 py-3 bg-zinc-700 hover:bg-zinc-600 text-zinc-400 hover:text-zinc-100 font-medium rounded-lg transition-all duration-200 border-0 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-zinc-600 focus:ring-offset-zinc-800">
                            Cancel
                        </button>
                        <button type="submit"
                            class="flex-1 px-6 py-3 bg-zinc-200 hover:bg-zinc-100 text-zinc-900 font-medium rounded-lg transition-all duration-200 border-0 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-zinc-200 focus:ring-offset-zinc-800">
                            Lock-in
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- JavaScript for Form Handling -->
    <script>
        document.getElementById('recordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = {
                uid: document.getElementById('uid').value,
                username: document.getElementById('username').value,
                invoiceNum: document.getElementById('invoiceNum').value,
                date: document.getElementById('date').value,
                amount: document.getElementById('amount').value
            };
            const messageContainer = document.getElementById('messageContainer');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');
            messageContainer.classList.remove('hidden');

            const isSuccess = true; 
            if (isSuccess) {
                successMessage.classList.remove('hidden');
                errorMessage.classList.add('hidden');
                setTimeout(() => {
                    this.reset();
                    messageContainer.classList.add('hidden');
                    successMessage.classList.add('hidden');
                }, 3000);
            } else {
                errorMessage.classList.remove('hidden');
                successMessage.classList.add('hidden');
            }
            console.log('Form submitted:', formData);
        });
    </script>
</body>
</html>
