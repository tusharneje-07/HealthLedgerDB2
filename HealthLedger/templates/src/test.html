<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Upload to Flask API</title>
</head>
<body>
  <h2>Upload Image for Prediction</h2>
  <input type="file" id="imageInput" accept="image/*">
  <button onclick="uploadImage()">Upload</button>

  <script>
    async function uploadImage() {
      const input = document.getElementById('imageInput');
      const file = input.files[0];

      if (!file) {
        console.log("Please select an image file first.");
        return;
      }

      // Create FormData object
      const formData = new FormData();
      formData.append("file", file); // 'file' key must match Flask's expected field name

      try {
        // Send POST request to Flask endpoint
        const response = await fetch("http://10.25.24.110:5000/predict", {
          method: "POST",
          body: formData
        });

        // Read response as text or JSON depending on your API
        const text = await response.text();

        console.log("Server Response:", text);
      } catch (error) {
        console.error("Error:", error);
      }
    }
  </script>
</body>
</html>
