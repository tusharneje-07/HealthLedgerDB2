
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HealthLedger - Invoices</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<style>
		@keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
		.sidebar-enter { animation: slideIn 0.3s ease-out; }
		.card-hover { transition: all 0.25s ease; }
		.card-hover:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
		.modal-open { overflow: hidden; }
	</style>
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen">
	<!-- Hidden input for user email (Jinja variable) -->
	<input type="hidden" id="userEmail" value="{{ user_email }}">

	<!-- Navbar (same style as dashboard) -->
	<nav class="bg-zinc-800 border-b border-zinc-700 sticky top-0 z-50">
		<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
			<div class="flex justify-between items-center h-16">
				<div class="flex items-center">
					<div class="text-xl font-semibold text-zinc-100">HealthLedger</div>
				</div>

				<div class="hidden md:flex space-x-6">
					<a href="/dashboard" class="text-zinc-400 hover:text-zinc-300 transition-colors duration-200">Dashboard</a>
					<a href="/invoices" class="text-zinc-100 hover:text-zinc-100 transition-colors duration-200 font-medium">Invoices</a>
					<a href="/logout" class="text-zinc-400 hover:text-zinc-100 transition-colors duration-200">SleepOut</a>
				</div>

				<div class="flex items-center space-x-4">
					<button class="text-zinc-400 hover:text-zinc-100 transition-colors duration-200">
						<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
					</button>
					<button id="mobileMenuBtn" class="md:hidden text-zinc-400 hover:text-zinc-100">
						<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
					</button>
					<div class="hidden md:flex items-center space-x-2">
						<div class="w-8 h-8 bg-zinc-700 rounded-full flex items-center justify-center text-sm font-medium">TN</div>
					</div>
				</div>
			</div>
		</div>
	</nav>

	<!-- Mobile Sidebar (copied from DASH.html so mobile menu works the same) -->
	<div id="mobileSidebar" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden">
		<div class="fixed right-0 top-0 h-full w-64 bg-zinc-800 shadow-xl sidebar-enter">
			<div class="p-6">
				<div class="flex justify-between items-center mb-8">
					<div class="w-10 h-10 bg-zinc-700 rounded-full flex items-center justify-center text-sm font-medium">TN</div>
					<button id="closeSidebar" class="text-zinc-400 hover:text-zinc-100">
						<!-- close icon -->
						<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
					</button>
				</div>

				<nav class="space-y-4">
					<a href="/dashboard" class="block text-zinc-100 hover:text-zinc-300 py-2 px-4 rounded-lg bg-zinc-700">Dashboard</a>
					<a href="/invoices" class="block text-zinc-400 hover:text-zinc-100 py-2 px-4 rounded-lg hover:bg-zinc-700">Invoices</a>
					<a href="/logout" class="block text-zinc-400 hover:text-zinc-100 py-2 px-4 rounded-lg hover:bg-zinc-700">SleepOut</a>
				</nav>
			</div>
		</div>
	</div>

	<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
		<div class="mb-6 flex items-center justify-between">
			<div>
				<h1 class="text-3xl sm:text-4xl font-bold">Invoices</h1>
				<p class="text-zinc-400">All your invoices are listed below. Click See Details to view or perform actions.</p>
			</div>
			<div>
				<button id="refreshBtn" class="bg-zinc-700 hover:bg-zinc-600 text-zinc-100 py-2 px-4 rounded-lg">Refresh</button>
			</div>
		</div>

		<!-- List container -->
		<div id="invoicesContainer" class="space-y-4">
			<!-- Invoice cards will be injected here -->
		</div>

		<!-- Empty state -->
		<div id="emptyState" class="hidden text-center py-12 text-zinc-400">
			No invoices to show.
		</div>
	</main>

	<!-- Invoice Details Modal -->
	<div id="modalOverlay" class="fixed inset-0 bg-black bg-opacity-60 z-50 hidden items-center justify-center px-4">
		<div id="modal" class="bg-gradient-to-b from-zinc-900 to-zinc-800 rounded-2xl max-w-3xl w-full mx-auto p-6 shadow-2xl ring-1 ring-black/40 transform transition-all duration-200 max-h-[85vh] overflow-auto">
			<div class="flex items-start justify-between mb-4">
				<h2 id="modalTitle" class="text-xl font-semibold">Invoice Details</h2>
				<button id="closeModal" class="text-zinc-400 hover:text-zinc-100">✕</button>
			</div>

			<div id="modalBody" class="space-y-4 text-zinc-200">
				<!-- Details populated by JS -->
				<div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
					<div>
						<p class="text-zinc-400 text-sm">Invoice</p>
						<div id="mInvoiceNum" class="font-medium text-lg">-</div>
					</div>
					<div>
						<p class="text-zinc-400 text-sm">Date</p>
						<div id="mDate" class="font-medium">-</div>
					</div>
					<div>
						<p class="text-zinc-400 text-sm">Amount</p>
						<div id="mAmount" class="font-medium">-</div>
					</div>
					<div>
						<p class="text-zinc-400 text-sm">Paid</p>
						<div id="mPaid" class="font-medium">-</div>
					</div>
				</div>

				<div>
					<p class="text-zinc-400 text-sm">Status</p>
					<div id="mStatus" class="font-semibold text-yellow-300">-</div>
				</div>

				<div id="mRemainingRow" class="hidden">
					<p class="text-zinc-400 text-sm">Remaining</p>
					<div id="mRemaining" class="font-medium">-</div>
				</div>
			</div>

			<div class="mt-6 flex flex-col sm:flex-row sm:space-x-3 space-y-2 sm:space-y-0">
				<button id="printBtn" class="w-full sm:w-auto bg-zinc-700 hover:bg-zinc-600 text-zinc-100 py-2 px-4 rounded-lg">Download & Print</button>
				<button id="payBtn" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 text-white py-2 px-4 rounded-lg hidden">Pay Amount</button>
				<button id="closeBtn" class="w-full sm:w-auto bg-zinc-600 hover:bg-zinc-500 text-zinc-100 py-2 px-4 rounded-lg">Close</button>
			</div>
		</div>
	</div>

	<!-- Simple small toast/modal for payment done -->
	<div id="toast" class="fixed right-4 bottom-4 bg-green-600 text-white px-4 py-2 rounded shadow hidden z-60">Payment done</div>

	<script>
		// Mobile menu functionality (defensive: check elements exist)
		const mobileMenuBtn = document.getElementById('mobileMenuBtn');
		const mobileSidebar = document.getElementById('mobileSidebar');
		const closeSidebar = document.getElementById('closeSidebar');

		if (mobileMenuBtn && mobileSidebar) {
			mobileMenuBtn.addEventListener('click', () => {
				mobileSidebar.classList.remove('hidden');
			});

			// closeSidebar may be inside the sidebar; guard it
			if (closeSidebar) {
				closeSidebar.addEventListener('click', () => {
					mobileSidebar.classList.add('hidden');
				});
			}

			mobileSidebar.addEventListener('click', (e) => {
				if (e.target === mobileSidebar) {
					mobileSidebar.classList.add('hidden');
				}
			});
		}
        
		const invoicesContainer = document.getElementById('invoicesContainer');
		const emptyState = document.getElementById('emptyState');
		const refreshBtn = document.getElementById('refreshBtn');
		const userEmail = document.getElementById('userEmail') ? document.getElementById('userEmail').value : '';

		// Modal elements
		const modalOverlay = document.getElementById('modalOverlay');
		const modal = document.getElementById('modal');
		const closeModal = document.getElementById('closeModal');
		const closeBtn = document.getElementById('closeBtn');
		const printBtn = document.getElementById('printBtn');
		const payBtn = document.getElementById('payBtn');
		const toast = document.getElementById('toast');

		let currentInvoice = null;

		function formatCurrency(amount){
			return '₹' + Number(amount).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
		}

		function formatDate(dateString){
			if(!dateString) return '-';
			const d = new Date(dateString);
			return d.toLocaleDateString('en-IN', { year:'numeric', month:'short', day:'numeric' });
		}

		async function fetchInvoices(){
			invoicesContainer.innerHTML = '';
			emptyState.classList.add('hidden');
			try{
				// If we have a user email (provided by the view), request the per-user API
				let res;
				if(userEmail){
					const encoded = encodeURIComponent(btoa(userEmail));
					res = await fetch(`/api/user/invoices/${encoded}/`);
				} else {
					// Fallback to global endpoint when no user context is available
					res = await fetch('/api/load_data/?size=1000');
				}
				if(!res.ok) throw new Error('Failed to load');
				const data = await res.json();

				// data format may be {records: [...]} or array
				const records = Array.isArray(data) ? data : (data.records || data.items || []);

				if(!records.length){
					emptyState.classList.remove('hidden');
					return;
				}

				records.forEach(rec => renderInvoiceCard(rec));
			}catch(err){
				console.error(err);
				emptyState.textContent = 'Failed to load invoices.';
				emptyState.classList.remove('hidden');
			}
		}

		function renderInvoiceCard(rec){
			// Try to normalize fields from different API shapes
			const invoiceNum = rec.invoiceNum || rec.INNVOCE_NUM || rec.innvoce_num || rec.invoice_number || rec.invoice || rec.innvoce_num;
			const date = rec.date || rec.DATE || rec.date_created || '';
			const amount = rec.amount || rec.AMOUNT || rec.total || 0;
			const paid = (rec.paidAmount !== undefined) ? rec.paidAmount : (rec.PAID_AMOUNT || rec.paid || 0);
			const status = rec.remark || (paid >= amount ? 'Paid' : 'Pending');

			const card = document.createElement('div');
			card.className = 'card-hover bg-zinc-800 rounded-xl p-4 sm:p-6 border border-zinc-700 flex flex-col sm:flex-row justify-between items-start sm:items-center';
			card.innerHTML = `
				<div class="flex-1 w-full">
					<div class="flex items-center justify-between">
						<div>
							<div class="text-sm text-zinc-400">Invoice</div>
							<div class="font-medium text-lg">${invoiceNum || '-'} </div>
						</div>
						<div class="text-sm text-zinc-400 text-right">
							<div>${formatDate(date)}</div>
							<div class="font-semibold text-zinc-100">${formatCurrency(amount)}</div>
						</div>
					</div>
					<div class="mt-3 text-zinc-400 text-sm">Status: <span class="font-medium text-${status === 'Paid' ? 'green' : 'yellow'}-400">${status}</span></div>
				</div>
				<div class="mt-4 sm:mt-0 sm:ml-6 flex-shrink-0 flex space-x-2">
					<button class="seeDetailsBtn bg-zinc-700 hover:bg-zinc-600 text-zinc-100 py-2 px-4 rounded-lg" data-invoice="${invoiceNum}">See Details</button>
				</div>
			`;

			invoicesContainer.appendChild(card);
			// Attach handler
			card.querySelector('.seeDetailsBtn').addEventListener('click', () => openDetails(invoiceNum));
		}

		async function openDetails(invoiceNum){
			// Fetch details from invoice API
			try{
				const res = await fetch(`/api/get_data_by_invoice_id?invoice_num=${encodeURIComponent(invoiceNum)}`);
				if(!res.ok) throw new Error('Failed to fetch invoice');
				const body = await res.json();
				// some endpoints return a list or object
				const info = Array.isArray(body) ? body[0] : body;
				currentInvoice = info;

				document.getElementById('mInvoiceNum').textContent = info.invoiceNum || info.invoiceNum || invoiceNum;
				document.getElementById('mDate').textContent = formatDate(info.date || info.DATE);
				document.getElementById('mAmount').textContent = formatCurrency(info.amount || info.AMOUNT || 0);
				document.getElementById('mPaid').textContent = formatCurrency(info.paidAmount || info.PAID_AMOUNT || 0);

				const status = (info.remark || ((info.paidAmount || 0) >= (info.amount || 0) ? 'Paid' : 'Pending'));
				document.getElementById('mStatus').textContent = status;

				const remaining = (info.remainingAmount !== undefined) ? info.remainingAmount : Math.max(0, (info.amount || 0) - (info.paidAmount || 0));
				if(remaining > 0){
					document.getElementById('mRemaining').textContent = formatCurrency(remaining);
					document.getElementById('mRemainingRow').classList.remove('hidden');
				} else {
					document.getElementById('mRemainingRow').classList.add('hidden');
				}

				// Buttons
				printBtn.onclick = () => window.open(`/print/${encodeURIComponent(invoiceNum)}/`, '_blank');

				if(status.toLowerCase() === 'pending'){
					payBtn.classList.remove('hidden');
				} else {
					payBtn.classList.add('hidden');
				}

				payBtn.onclick = () => {
					// temporary client-side simulation
					toast.textContent = 'Payment done';
					toast.classList.remove('hidden');
					setTimeout(()=> toast.classList.add('hidden'), 2500);
					// also close modal after short delay
					setTimeout(closeDetails, 1200);
				};

				showModal();
			}catch(err){
				console.error(err);
				alert('Failed to load invoice details');
			}
		}

		function downloadInvoiceJson(info, invoiceNum){
			const filename = `invoice-${invoiceNum}.json`;
			const blob = new Blob([JSON.stringify(info, null, 2)], {type: 'application/json'});
			const url = URL.createObjectURL(blob);
			const a = document.createElement('a');
			a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
			URL.revokeObjectURL(url);
		}

		function showModal(){
				modalOverlay.classList.remove('hidden');
				modalOverlay.classList.add('flex');
				document.documentElement.classList.add('modal-open');
		}

		function closeDetails(){
			modalOverlay.classList.remove('flex');
			modalOverlay.classList.add('hidden');
			document.documentElement.classList.remove('modal-open');
			currentInvoice = null;
		}

		closeModal.addEventListener('click', closeDetails);
		closeBtn.addEventListener('click', closeDetails);

		refreshBtn.addEventListener('click', fetchInvoices);

		// init
		fetchInvoices();
	</script>
</body>
</html>
